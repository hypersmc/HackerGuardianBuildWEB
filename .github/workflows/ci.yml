name: Web CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Validate Composer manifest
        working-directory: backend
        run: composer validate --no-check-lock --strict
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: find backend/app backend/bootstrap backend/config backend/database backend/routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Boot Laravel and verify routes and HG commands
        working-directory: backend
        run: |
          php artisan list --raw | grep -E '^hg:(about|user:create)'
          php artisan route:list --path=api/v1 --except-vendor

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
